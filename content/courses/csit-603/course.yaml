code: CSIT 603
slug: csit-603
title: Enterprise Systems & Business Process Re-engineering
status: listed
statusNote: Core course in the MSc IT for Business Semester 1 programme (3 credit slots).
classification: core
creditSlots: 3
accent: sky
description: >
  How organisations use integrated enterprise systems to run, coordinate and improve their operations, and how
  business processes are analysed, modelled in BPMN, re-engineered and supported by technology. Practical work uses
  realistic Ghanaian pharmacy, hospital, retail, hospitality and logistics scenarios.
outcomes:
  - Explain the role of enterprise systems, enterprise architecture and integration in organisations.
  - Compare ERP, CRM, SCM and HRIS applications and the data and analytics that support them.
  - Identify, map, model (BPMN 2.0) and document business processes.
  - Apply business process re-engineering principles to diagnose inefficiencies and design improved processes.
  - Plan an enterprise system implementation from requirements gathering to post-implementation evaluation.
  - Evaluate enterprise technologies such as workflow automation, cloud ERP and business intelligence.
modules:
  - slug: enterprise-systems-foundations
    title: Enterprise Systems Foundations
    description: Why organisations integrate their information systems and how enterprise architecture guides that integration.
    lessons:
      - slug: enterprise-and-business-information-systems
        title: Enterprise Systems and Business Information Systems
        topics: [Enterprise systems, Business information systems, Functional silos]
      - slug: organisational-information-flows
        title: Organisational Information Flows
        topics: [Organisational information flows, Transaction processing, Management reporting]
      - slug: enterprise-architecture-and-integration
        title: Enterprise Architecture and Enterprise Integration
        topics: [Enterprise architecture, TOGAF overview, Enterprise integration, APIs and middleware]
  - slug: enterprise-applications
    title: Enterprise Applications
    description: The major families of enterprise application and the data that connects them.
    lessons:
      - slug: erp-systems
        title: Enterprise Resource Planning (ERP) Systems
        topics: [ERP, ERP modules, Best-practice processes]
      - slug: erp-architecture
        title: "ERP Architecture: Modules, Tiers, Integration and Deployment"
        topics: [ERP architecture, Three-tier architecture, ERP modules, Deployment models]
      - slug: crm-scm-and-hris
        title: CRM, SCM and HRIS
        topics: [CRM, SCM, HRIS]
      - slug: enterprise-databases-and-analytics
        title: Enterprise Databases and Enterprise Analytics
        topics: [Enterprise databases, Master data, Enterprise analytics]
  - slug: business-process-management
    title: Business Process Management
    description: Seeing the organisation as a set of processes, and capturing them precisely.
    lessons:
      - slug: business-processes-and-identification
        title: Business Processes and Process Identification
        topics: [Business processes, Process identification, Process architecture]
      - slug: process-mapping-and-documentation
        title: Process Mapping and Process Documentation
        topics: [Process mapping, Process documentation, SIPOC, Swimlanes]
      - slug: bpmn-modelling
        title: Process Modelling with BPMN 2.0
        topics: [Process modelling, BPMN, Camunda Modeler, Bizagi Modeler]
  - slug: business-process-reengineering
    title: Business Process Re-engineering
    description: Radically rethinking processes to achieve dramatic improvements, and managing the human side of change.
