code: CSIT 601
slug: csit-601
title: Research Methods
status: listed
statusNote: Core course in the MSc IT for Business Semester 1 programme (3 credit slots).
classification: core
creditSlots: 3
accent: indigo
description: >
  A postgraduate grounding in how business and information technology research is conceived, designed,
  conducted, analysed, written up and defended. The course moves from research philosophy to a complete,
  defensible research proposal, using Ghanaian business and technology contexts throughout.
outcomes:
  - Explain the philosophical foundations of research and justify a paradigm for a given study.
  - Formulate researchable problems, objectives, questions and hypotheses.
  - Conduct, evaluate and synthesise a scholarly literature review and build a conceptual framework.
  - Select and justify appropriate research designs, sampling strategies and data collection methods.
  - Apply fundamental quantitative and qualitative analysis techniques and interpret findings responsibly.
  - Evaluate research quality and apply ethical principles, including data protection.
  - Write and defend a structured research proposal using APA 7 referencing.
modules:
  - slug: foundations-of-research
    title: Foundations of Research
    description: What research is, why it matters, and the philosophical positions that shape how it is done.
    lessons:
      - slug: meaning-purpose-and-characteristics
        title: The Meaning, Purpose and Characteristics of Research
        topics: [Meaning and purpose of research, Research characteristics, Research methodology versus research methods]
      - slug: research-paradigms
        title: "Research Paradigms: Positivism, Interpretivism and Pragmatism"
        topics: [Research paradigms, Positivism, Interpretivism, Pragmatism]
      - slug: ontology-and-epistemology
        title: Ontology and Epistemology
        topics: [Ontology, Epistemology, Axiology, Linking philosophy to design]
  - slug: research-problem-development
    title: Research Problem Development
    description: Turning a topic of interest into a focused, researchable problem with clear aims.
    lessons:
      - slug: identifying-problems-and-background
        title: Identifying Research Problems and Writing the Background
        topics: [Identifying research problems, Research background, Sources of research problems]
      - slug: problem-statements-and-scope
        title: Problem Statements, Scope and Limitations
        topics: [Problem statements, Scope, Delimitations, Limitations]
      - slug: objectives-questions-and-hypotheses
        title: Research Objectives, Questions and Hypotheses
        topics: [Research objectives, Research questions, Research hypotheses, Alignment of aims]
  - slug: literature-review
    title: Literature Review
    description: Finding, evaluating and synthesising scholarship, and building theoretical and conceptual frameworks.
    lessons:
      - slug: purpose-and-searching
        title: The Purpose of a Literature Review and Searching for Literature
        topics: [Purpose of literature reviews, Finding scholarly literature, Academic databases, Search strategies]
      - slug: evaluating-sources-and-gaps
        title: Evaluating Sources and Identifying Research Gaps
        topics: [Evaluating academic sources, Identifying research gaps]
      - slug: synthesising-literature
        title: Synthesising Literature
        topics: [Synthesising literature, Synthesis matrices, Critical writing]
      - slug: theoretical-and-conceptual-frameworks
        title: Theoretical and Conceptual Frameworks
        topics: [Theoretical frameworks, Conceptual frameworks, TAM, UTAUT, Diffusion of Innovations]
  - slug: research-design
    title: Research Design
    description: Choosing the overall plan that connects research questions to evidence.
    lessons:
      - slug: quantitative-qualitative-and-mixed
        title: Quantitative, Qualitative and Mixed-Methods Research
        topics: [Quantitative research, Qualitative research, Mixed-method research]
      - slug: exploratory-descriptive-explanatory
