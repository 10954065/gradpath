code: CSIT 621
slug: csit-621
title: Emerging Technologies for Business I
status: listed
statusNote: Part of the GradPath initial curriculum. Confirm the course's status against your official registration.
accent: teal
description: >
  A critical survey of emerging technologies and how businesses evaluate and adopt them: cloud and edge computing,
  IoT, blockchain, immersive technologies, quantum and high-performance computing, robotics, 5G, smart cities and
  sustainable technology, ending with structured frameworks for technology evaluation and strategy.
outcomes:
  - Explain how emerging technologies arise, diffuse and disrupt industries.
  - Compare cloud service and deployment models and evaluate edge and hybrid architectures.
  - Describe IoT architectures and their security and business implications.
  - Assess blockchain, immersive technologies, quantum computing and other advanced technologies for business use.
  - Evaluate the environmental impact of technology and approaches to sustainable IT.
  - Apply cost-benefit, risk and readiness frameworks to recommend technology adoption decisions.
modules:
