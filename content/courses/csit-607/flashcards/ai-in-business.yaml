module: ai-in-business
cards:
  - lesson: bi-predictive-analytics-and-forecasting
    front: How does business intelligence differ from predictive analytics?
    back: BI integrates and presents historical and current data to show what happened and why; predictive analytics uses models to estimate what is likely to happen, with uncertainty.
  - lesson: bi-predictive-analytics-and-forecasting
    front: What are the main layers of a BI architecture?
    back: Source systems, ETL or ELT pipelines, a data warehouse or lakehouse, and a presentation layer of dashboards and reports, all governed by data definitions, ownership and quality controls.
  - lesson: bi-predictive-analytics-and-forecasting
    front: State the simple exponential smoothing formula and the effect of alpha.
    back: F(t+1) = α × A(t) + (1 − α) × F(t). High α reacts quickly but follows noise; low α is smoother but slower to respond.
  - lesson: bi-predictive-analytics-and-forecasting
    front: Why should advanced forecasting models be compared with simple benchmarks?
    back: Simple methods are often competitive, especially with short or noisy data; a complex model is only justified if it beats them on the same held-out periods.
  - lesson: bi-predictive-analytics-and-forecasting
    front: Why is MAPE problematic for slow-moving products?
    back: It divides by actual values, so it is undefined when sales are zero and is inflated by small denominators; MAE or scaled measures are often better.
  - lesson: customer-analytics-and-fraud-detection
    front: What do the letters in RFM stand for and how is recency scored?
    back: Recency, frequency and monetary value. Recency scores highest for customers who purchased most recently, that is, the fewest days ago.
  - lesson: customer-analytics-and-fraud-detection
    front: Why is predicting churn not enough to reduce it?
    back: Some predicted churners will not respond to an offer and some would stay anyway; uplift-oriented targeting tested with control groups directs spending where it changes behaviour.
  - lesson: customer-analytics-and-fraud-detection
    front: Why do fraud systems combine rules, supervised models and anomaly detection?
    back: Rules are transparent but evadable, supervised models need delayed and incomplete labels, and anomaly detection catches new schemes; layering covers each method's weaknesses.
  - lesson: customer-analytics-and-fraud-detection
    front: How should class imbalance be handled in fraud modelling?
    back: Resample or weight the training data only, choose a cost-sensitive threshold on validation data, and evaluate with precision, recall and PR-AUC rather than accuracy.
  - lesson: customer-analytics-and-fraud-detection
    front: Why does fraud detection suffer from concept drift?
    back: Fraudsters adapt to controls, changing the relationship between features and fraud, so models must be monitored, retrained and fed investigator outcomes.
  - lesson: customer-analytics-and-fraud-detection
    front: What ethical lesson does the Target pregnancy-prediction case teach?
    back: Accurately inferring sensitive traits from ordinary data can feel intrusive and cause harm, so organisations must decide in advance which inferences are acceptable.
  - lesson: support-automation-and-decision-support
    front: Why can containment rate be misleading?
    back: A bot can keep customers from reaching humans without solving their problems. Resolution, verified by absence of repeat contact, and satisfaction must also be measured.
  - lesson: support-automation-and-decision-support
    front: When should a support chatbot escalate to a human?
    back: When intent confidence is low, the customer repeats themselves or shows frustration, or the topic is sensitive such as fraud, PIN compromise, bereavement or health, always passing conversation context.
  - lesson: support-automation-and-decision-support
    front: What did Moffatt v. Air Canada (2024) establish for chatbot deployers?
    back: The tribunal held the airline responsible for incorrect bereavement-fare information from its website chatbot, rejecting the argument that the bot was separately responsible.
  - lesson: support-automation-and-decision-support
    front: What are the three components of a decision support system?
    back: Data management, model management (forecasts, optimisation, simulation, ML predictions) and a user interface, supporting semi-structured decisions.
  - lesson: support-automation-and-decision-support
    front: What is automation bias and how can a DSS reduce it?
    back: Over-reliance on system recommendations even when wrong. Showing key factors and uncertainty, requiring recorded reasons and auditing agreement rates encourage critical use.
  - lesson: recommendation-systems
    front: How does item-based collaborative filtering differ from user-based, and why is it often easier to scale?
    back: It recommends items similar to those the user liked, where similarity comes from shared audiences, instead of finding similar users. Item similarities change slowly and can be precomputed offline, so serving is fast.
  - lesson: recommendation-systems
    front: Explain the intuition of matrix factorisation in one sentence.
    back: Each user and item is described by a short vector of learned latent factors, and the predicted rating is their dot product, which compresses a sparse matrix into patterns that generalise.
  - lesson: recommendation-systems
    front: What are the three forms of the cold-start problem and one mitigation for each?
    back: New user (onboarding questions), new item (content-based similarity or managed exposure) and new system (popularity rules and data collection until interactions accumulate).
  - lesson: recommendation-systems
    front: Define precision@k and recall@k, and say how each changes as k increases.
    back: Precision@k is relevant items in the top k divided by k; recall@k is relevant items in the top k divided by all relevant items. Raising k usually lowers precision and raises recall.
  - lesson: recommendation-systems
    front: Why must a recommender be validated with an A/B test and not offline metrics alone?
    back: Offline data reflect past behaviour shaped by the old system and cannot show whether recommendations change behaviour. A randomised test measures real business impact with guardrail metrics.
  - lesson: recommendation-systems
    front: Name three risks of personalisation and one mitigation for each.
    back: Filter bubbles (diversity objectives and user controls), unfair exposure for providers (exposure budgets and fairness audits) and privacy harm (minimisation, transparency and compliance with Act 843).
  - lesson: ai-adoption-and-implementation-strategy
    front: List the main barriers to AI adoption in organisations.
    back: Data quality and access, skills, total cost, culture and leadership, legacy system integration, trust and explainability, and regulation such as Ghana's Data Protection Act, 2012 (Act 843).
  - lesson: ai-adoption-and-implementation-strategy
    front: How do you prioritise AI use cases using value and feasibility?
    back: Score each use case on value and on feasibility, weight and combine the scores, and plot them. High value and high feasibility are quick wins; high value and low feasibility are strategic bets needing enabling investment.
  - lesson: ai-adoption-and-implementation-strategy
    front: When is build, buy or partner the best sourcing choice?
    back: Build when the capability is a differentiator using proprietary data; buy for generic, commodity needs where speed matters; partner when domain data exist but skills are limited. Consider total cost, lock-in and exit plans.
  - lesson: ai-adoption-and-implementation-strategy
    front: What is pilot purgatory and how can it be avoided?
    back: Many pilots launched but few scaled. Avoid it by testing real data feeds, users and integration, setting a baseline, control and pre-agreed stop-or-go rule, and naming operational owners.
  - lesson: ai-adoption-and-implementation-strategy
    front: Why does an AI model need MLOps and named hand-off owners after deployment?
    back: Data and behaviour drift, so performance decays. MLOps provides versioning, monitoring, retraining and rollback, and named owners ensure someone answers for incidents, changes and regulator or customer queries.
  - lesson: ai-adoption-and-implementation-strategy
    front: How do you calculate risk-adjusted ROI and payback for an AI project?
    back: ROI = (total benefit minus total cost) divided by total cost, with benefits multiplied by a realisation factor. Payback = one-off cost divided by annual net benefit after running costs.
