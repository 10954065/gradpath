code: CSIT 613
slug: csit-613
title: E-Business Platforms & FinTech
status: listed
statusNote: Elective (3 credit slots). Students choose their elective; record yours in Settings, Courses.
classification: elective
creditSlots: 3
accent: emerald
description: >
  How digital platforms and financial technology create and capture value, with particular attention to Ghana's
  mobile money ecosystem and SME digital commerce. Covers e-business models, e-commerce technology, digital finance,
  payment security, blockchain and practical solution design. Content is educational and is not financial,
  investment or regulatory advice.
outcomes:
  - Explain e-business, e-commerce and digital value creation.
  - Compare e-commerce and platform business models.
  - Describe the technology components of an e-commerce operation.
  - Explain FinTech, digital banking, mobile money, wallets and payment gateways.
  - Evaluate payment security, fraud prevention and reconciliation controls.
  - Explain blockchain fundamentals and assess their relevance to digital finance.
  - Analyse Ghana's digital payments ecosystem and design a digital commerce or payment solution for an SME.
modules:
